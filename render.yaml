services:
  - type: web
    name: web-compose
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    envVars:
      - key: PORT
        value: 3000
      - key: SERVICES_CONFIG_PATH
        value: /etc/secrets/services.edn
      # Do NOT set ENABLE_SCRAPER here. The registry scraper (headless Chrome +
      # daily scrape job) is a local/dev-only feature and must never run in
      # production.
